services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spmprep
      POSTGRES_USER: spmprep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/migrations/001_schema.up.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./api/migrations/002_seed.up.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spmprep"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://spmprep:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/spmprep?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ""
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
