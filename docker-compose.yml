services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spmprep
      POSTGRES_USER: spmprep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/migrations/001_schema.up.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./api/migrations/002_seed.up.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./api/migrations/003_more_questions.up.sql:/docker-entrypoint-initdb.d/03_more_questions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spmprep"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://spmprep:${POSTGRES_PASSWORD}@postgres:5432/spmprep?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api

volumes:
  pgdata:
